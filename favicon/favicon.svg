<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3D6E"/>
      <stop offset="100%" stop-color="#06182C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7718"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Outer gold border -->
  <rect x="24" y="24" width="464" height="464" rx="76" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.9"/>
  <rect x="36" y="36" width="440" height="440" rx="66" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Compass Star -->
  <g transform="translate(256, 175)" filter="url(#shadow)">
    <!-- 8-point compass star -->
    <path d="M0,-85 L18,-24 L78,-78 L24,-18 L85,0 L24,18 L78,78 L18,24 L0,85 L-18,24 L-78,78 L-24,18 L-85,0 L-24,-18 L-78,-78 L-18,-24 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="14" fill="#0A2440" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#FFF2B2"/>
  </g>

  <!-- Brand Typography -->
  <g text-anchor="middle" font-family="'Fraunces', Georgia, serif" filter="url(#shadow)">
    <text x="256" y="340" font-size="76" font-weight="600" fill="#FFFFFF" letter-spacing="-1">Tours&amp;Co</text>
  </g>

  <g text-anchor="middle" font-family="'Hanken Grotesk', system-ui, sans-serif" font-weight="700" letter-spacing="4">
    <line x1="160" y1="380" x2="352" y2="380" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8"/>
    <circle cx="256" cy="380" r="4" fill="#FFF2B2"/>
    <text x="256" y="425" font-size="24" fill="url(#goldGrad)" opacity="0.95">BESPOKE JOURNEYS</text>
  </g>
</svg>